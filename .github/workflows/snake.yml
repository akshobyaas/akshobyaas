# Put this file at: .github/workflows/snake.yml  (in your akshobyaas/akshobyaas repo)
# It redraws your contribution graph as a snake every day and pushes the SVGs
# to a branch called "output", which the README reads from.

name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC (5:30 AM IST)
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
